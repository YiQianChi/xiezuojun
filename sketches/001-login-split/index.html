<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写作菌登录 · 方案A 左右分栏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f6f2; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #2c3a2e; -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 780px; max-width: 94vw; background: #fff; border-radius: 18px;
    box-shadow: 0 12px 40px rgba(60, 90, 66, .10); display: flex; overflow: hidden;
  }
  /* 左：扫码 */
  .qr-pane {
    width: 320px; background: linear-gradient(160deg, #f2f8f0, #e8f2e4);
    padding: 48px 32px; display: flex; flex-direction: column; align-items: center;
    border-right: 1px solid #e6ede2;
  }
  .qr-pane h3 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  .qr-pane .tip { font-size: 12px; color: #7a8a7c; margin-bottom: 24px; }
  .qr-box {
    width: 180px; height: 180px; background: #fff; border-radius: 12px; padding: 12px;
    box-shadow: 0 4px 16px rgba(60, 90, 66, .12); position: relative; cursor: pointer;
  }
  .qr-box canvas { width: 100%; height: 100%; image-rendering: pixelated; border-radius: 6px; }
  .qr-box .refresh {
    position: absolute; inset: 0; background: rgba(255,255,255,.92); border-radius: 12px;
    display: none; align-items: center; justify-content: center; font-size: 13px; color: #07c160;
  }
  .qr-box:hover .refresh { display: flex; }
  .qr-pane .wx { margin-top: 20px; font-size: 13px; color: #07c160; display: flex; align-items: center; gap: 6px; }
  /* 右：表单 */
  .form-pane { flex: 1; padding: 48px 48px 40px; }
  .logo { font-family: Georgia, "Songti SC", serif; font-size: 30px; font-weight: 700; letter-spacing: 2px; }
  .sub { font-size: 13px; color: #9aa89c; margin: 6px 0 28px; }
  .tabs { display: flex; gap: 4px; background: #f2f5f0; padding: 4px; border-radius: 10px; margin-bottom: 24px; }
  .tabs button {
    flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: #7a8a7c; transition: all .15s;
  }
  .tabs button.active { background: #fff; color: #2c3a2e; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: #7a8a7c; margin-bottom: 6px; }
  .input {
    width: 100%; padding: 12px 14px; border: 1.5px solid #e2e9df; border-radius: 10px; font-size: 14px;
    outline: none; transition: border-color .15s; background: #fbfdfa;
  }
  .input:focus { border-color: #6aa877; background: #fff; }
  .code-row { display: flex; gap: 10px; }
  .code-row .input { flex: 1; }
  .code-btn {
    white-space: nowrap; padding: 0 16px; border: 1.5px solid #6aa877; color: #6aa877; background: #fff;
    border-radius: 10px; font-size: 13px; cursor: pointer;
  }
  .code-btn:disabled { opacity: .5; cursor: not-allowed; }
  .mode-switch { text-align: right; margin: -6px 0 14px; }
  .mode-switch a { font-size: 12px; color: #6aa877; text-decoration: none; cursor: pointer; }
  .submit {
    width: 100%; padding: 13px; border: 0; border-radius: 22px; font-size: 15px; font-weight: 600;
    background: linear-gradient(135deg, #8fc59b, #6aa877); color: #fff; cursor: pointer; margin-top: 6px;
  }
  .submit:active { opacity: .9; }
  .links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; }
  .links a { color: #7a8a7c; text-decoration: none; cursor: pointer; }
  .links a.reg { color: #6aa877; }
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
    background: #2c3a2e; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 700px) {
    .card { flex-direction: column; }
    .qr-pane { width: 100%; border-right: 0; border-bottom: 1px solid #e6ede2; padding: 32px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="qr-pane">
    <h3>微信扫码登录</h3>
    <div class="tip">打开微信扫一扫，确认即可登录</div>
    <div class="qr-box" onclick="refreshQr(this)">
      <canvas id="qr"></canvas>
      <div class="refresh">点击刷新二维码</div>
    </div>
    <div class="wx">✓ 与小程序账号互通</div>
  </div>
  <div class="form-pane">
    <div class="logo">写作菌</div>
    <div class="sub">一个写故事的地方</div>
    <div class="tabs">
      <button class="active" id="tab-email" onclick="switchTab('email')">邮箱登录</button>
      <button id="tab-phone" onclick="switchTab('phone')">手机号登录</button>
    </div>
    <div class="field">
      <label id="account-label">邮箱</label>
      <input class="input" id="account" placeholder="your@email.com">
    </div>
    <div class="field" id="pwd-field">
      <label>密码</label>
      <input class="input" type="password" placeholder="请输入密码">
    </div>
    <div class="field" id="code-field" style="display:none">
      <label>验证码</label>
      <div class="code-row">
        <input class="input" inputmode="numeric" maxlength="6" placeholder="6 位验证码">
        <button class="code-btn" id="code-btn" onclick="sendCode()">获取验证码</button>
      </div>
    </div>
    <div class="mode-switch"><a id="mode-toggle" onclick="toggleMode()">使用验证码登录 →</a></div>
    <button class="submit" onclick="toast('登录成功（demo）')">登 录</button>
    <div class="links">
      <a onclick="toast('跳转忘记密码（demo）')">忘记密码？</a>
      <a class="reg" onclick="toast('跳转注册（demo）')">没有账号？立即注册 →</a>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  // 伪二维码（demo 占位）
  function drawQr() {
    const c = document.getElementById('qr'), ctx = c.getContext('2d'), n = 25;
    c.width = n * 8; c.height = n * 8;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#1a1a1a';
    let seed = Date.now() % 100000;
    const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      if (rnd() > 0.52) ctx.fillRect(x * 8, y * 8, 8, 8);
    }
    const finder = (fx, fy) => {
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(fx, fy, 56, 56);
      ctx.fillStyle = '#fff'; ctx.fillRect(fx + 8, fy + 8, 40, 40);
      ctx.fillStyle = '#1a1a1a'; ctx.fillRect(fx + 16, fy + 16, 24, 24);
    };
    finder(0, 0); finder(c.width - 56, 0); finder(0, c.height - 56);
  }
  drawQr();
  let tab = 'email', mode = 'password', countdown = 0;
  function switchTab(t) {
    tab = t;
    document.getElementById('tab-email').classList.toggle('active', t === 'email');
    document.getElementById('tab-phone').classList.toggle('active', t === 'phone');
    document.getElementById('account-label').innerText = t === 'email' ? '邮箱' : '手机号';
    document.getElementById('account').placeholder = t === 'email' ? 'your@email.com' : '请输入手机号';
    // 手机号默认验证码登录
    if (t === 'phone' && mode === 'password') toggleMode();
    if (t === 'email' && mode === 'code') toggleMode();
  }
  function toggleMode() {
    mode = mode === 'password' ? 'code' : 'password';
    document.getElementById('pwd-field').style.display = mode === 'password' ? '' : 'none';
    document.getElementById('code-field').style.display = mode === 'code' ? '' : 'none';
    document.getElementById('mode-toggle').innerText = mode === 'password' ? '使用验证码登录 →' : '使用密码登录 →';
  }
  function sendCode() {
    if (countdown > 0) return;
    countdown = 60;
    const btn = document.getElementById('code-btn');
    btn.disabled = true;
    toast('验证码已发送（demo）');
    const timer = setInterval(() => {
      btn.innerText = countdown + 's';
      if (--countdown <= 0) { clearInterval(timer); btn.disabled = false; btn.innerText = '获取验证码'; }
    }, 1000);
  }
  function refreshQr(el) { drawQr(); toast('二维码已刷新（demo）'); }
  function toast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }
</script>
</body>
</html>
